updates:
- directory: /
  groups:
    dev-dependencies:
      dependency-type: development
      applies-to: version-updates
    production-dependencies:
      dependency-type: production
      applies-to: version-updates
    npm-security-updates:
      applies-to: security-updates
      patterns:
      - "*"
  package-ecosystem: npm
  ignore:
  - dependency-name: "typescript"
    versions:
    - ">=7.0.0" # typescript-eslint requires typescript <6.1.0; revisit once TS 7.1 lands
  schedule:
    interval: weekly
- directory: /
  groups:
    github-actions:
      patterns:
      - "*"
  ignore:
  - dependency-name: "github/gh-aw-actions/**"
  - dependency-name: "github/gh-aw-actions" # Managed by gh aw compile. Version-locked to the gh-aw compiler; do not bump.
  package-ecosystem: github-actions
  schedule:
    interval: weekly
# Third-party agent skills declared in /apm.yml (APM, Agent Package Manager).
# Dependabot moves the release-tag pins in apm.yml and regenerates
# apm.lock.yaml, but only runs `apm lock`: it does not refresh the installed
# files under .claude/, .agents/ and .github/agents/. On each of these PRs,
# run `apm install` and push the result (`apm audit` shows what is stale).
# cloudflare/security-audit-skill is pinned to a commit (no upstream release
# tags) and is never moved; use `apm outdated`.
- directory: /
  groups:
    agent-skills:
      patterns:
      - "*"
  package-ecosystem: apm
  cooldown:
    default-days: 8
  schedule:
    interval: weekly
version: 2
