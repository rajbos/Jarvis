name: CI

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main

permissions:
  contents: read

# Superseded PR runs are cancelled; pushes to main always finish so every commit gets a result
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check for committed build/test artifacts
        run: |
          matches="$(git ls-files -- '*_output.txt' '*coverage*.txt' '*.tsbuildinfo' 'coverage/*' ':(glob)tests/**/*.js' ':(glob)tests/**/*.map' ':(glob)tests/**/*.d.ts')"
          if [ -n "$matches" ]; then
            echo "::error::Generated build/test artifacts are committed to the repository. Remove them with 'git rm --cached' and rely on .gitignore:"
            echo "$matches"
            exit 1
          fi
          echo "No committed build/test artifacts found."

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Type-check renderer and unit tests
        # `tsc` in the build skips .tsx and tests/, and esbuild/vitest strip types without checking them
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check for unused dependencies
        run: npm run check:deps

      - name: Test (with coverage)
        run: npm run test:coverage

      - name: Install headless Chromium for view tests
        run: npx playwright install --with-deps chromium

      - name: View tests (headless browser)
        run: npm run test:views

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # Jarvis ships as a Windows-only app, so run the suite and a packaging smoke test on
  # Windows on every PR instead of finding path/packaging breakage at release time.
  windows:
    runs-on: windows-latest
    timeout-minutes: 25

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Package (unpacked, no installer)
        run: npx electron-builder --win --dir --publish never

      - name: Verify packaged layout
        run: |
          $required = @(
            'release/win-unpacked/Jarvis.exe'
            'release/win-unpacked/resources/app.asar'
            'release/win-unpacked/resources/app.asar.unpacked/dist/mcp-server/index.js'
            'release/win-unpacked/resources/scripts/read-onenote-section.ps1'
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            $missing | ForEach-Object { Write-Output "::error::Missing from packaged app: $_" }
            exit 1
          }
          Write-Output 'Packaged app layout OK.'

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Lint workflow files
        # gh-aw lock files are generated by `gh aw compile` and use syntax actionlint does not know yet
        run: |
          mapfile -t files < <(git ls-files '.github/workflows/*.yml' ':(exclude).github/workflows/*.lock.yml')
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -no-color "${files[@]}"
