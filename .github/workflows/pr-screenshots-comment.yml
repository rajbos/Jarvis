name: PR Screenshots Comment

# Second half of pr-screenshots.yml. Runs from the default branch with write
# access, so it never checks out or runs PR code: it only reads the
# `view-screenshots` artifact, which is treated as untrusted input.
#
#   1. Check that the PR in pr.json really is the PR the run built (head SHA).
#   2. scripts/screenshot-comment.mjs (from the default branch) validates
#      report.json and copies only real PNGs of the changed views to the
#      `view-screenshots` branch under pr-<number>/<head sha>/.
#   3. Push that branch, then write the | Name | Before | After | Diff |
#      comment linking the images by the pushed commit, and create or update
#      the single sticky comment on the PR.
#
# When the PR is closed its folder is removed from the branch tip again; the
# comment keeps rendering because its links point at the older commit.

on:
  workflow_run:
    workflows: ['PR Screenshots']
    types: [completed]
  pull_request_target:
    types: [closed]

permissions:
  contents: read

concurrency:
  # Serialise pushes to the screenshots branch
  group: view-screenshots-branch
  cancel-in-progress: false

env:
  ASSETS_BRANCH: view-screenshots

jobs:
  comment:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: read

    steps:
      - name: Checkout default branch (trusted scripts only)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Download screenshots
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: view-screenshots
          path: ${{ runner.temp }}/artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          number="$(jq -r '.number' "$RUNNER_TEMP/artifact/pr.json")"
          if ! [[ "$number" =~ ^[0-9]{1,9}$ ]]; then
            echo "::error::pr.json has no valid PR number"
            exit 1
          fi
          read -r state head_sha < <(gh api "repos/$REPO/pulls/$number" --jq '"\(.state) \(.head.sha)"')
          if [ "$head_sha" != "$RUN_HEAD_SHA" ]; then
            echo "::notice::PR #$number head is $head_sha, the run built $RUN_HEAD_SHA (newer push or mismatched artifact); skipping."
            exit 0
          fi
          if [ "$state" != "open" ]; then
            echo "::notice::PR #$number is $state; skipping."
            exit 0
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Checkout screenshots branch
        if: steps.pr.outputs.number
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          dir="$RUNNER_TEMP/assets"
          git init -q "$dir"
          cd "$dir"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config "http.https://github.com/.extraheader" "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git remote add origin "https://github.com/$REPO.git"
          if git ls-remote --exit-code --heads origin "$ASSETS_BRANCH" > /dev/null; then
            git fetch -q --depth 1 origin "$ASSETS_BRANCH"
            git checkout -q -b "$ASSETS_BRANCH" FETCH_HEAD
          else
            git checkout -q --orphan "$ASSETS_BRANCH"
            printf '# View screenshots\n\nGenerated by the PR Screenshots workflows for PR comments. Do not merge.\n' > README.md
            git add README.md
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Publish images
        if: steps.pr.outputs.number
        env:
          NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          ASSETS_DIR: ${{ steps.assets.outputs.dir }}
        run: |
          rm -rf "${ASSETS_DIR:?}/pr-$NUMBER"
          node scripts/screenshot-comment.mjs             --report "$RUNNER_TEMP/artifact/report.json"             --images "$RUNNER_TEMP/artifact"             --publish "$ASSETS_DIR/pr-$NUMBER/$HEAD_SHA"

      - name: Push screenshots branch
        if: steps.pr.outputs.number
        id: push
        env:
          NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        working-directory: ${{ steps.assets.outputs.dir }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No image changes to push."
          else
            git commit -q -m "Screenshots for PR #$NUMBER at ${HEAD_SHA:0:7}"
            pushed=false
            for _ in 1 2 3; do
              if git push -q origin "HEAD:$ASSETS_BRANCH"; then pushed=true; break; fi
              git pull -q --rebase origin "$ASSETS_BRANCH"
            done
            if [ "$pushed" != true ]; then
              echo "::error::Could not push to $ASSETS_BRANCH"
              exit 1
            fi
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Images are linked by the pushed commit, so they keep rendering after the
      # cleanup job removes the PR's folder from the branch tip.
      - name: Build comment
        if: steps.pr.outputs.number
        id: comment
        env:
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          ASSETS_DIR: ${{ steps.assets.outputs.dir }}
          ASSETS_SHA: ${{ steps.push.outputs.sha }}
        run: |
          node scripts/screenshot-comment.mjs             --report "$RUNNER_TEMP/artifact/report.json"             --images "$ASSETS_DIR/pr-$NUMBER/$HEAD_SHA"             --image-base "https://raw.githubusercontent.com/$REPO/$ASSETS_SHA/pr-$NUMBER/$HEAD_SHA"             --head-sha "$HEAD_SHA"             --run-url "$RUN_URL"             --out "$RUNNER_TEMP/comment.md"

      - name: Create or update PR comment
        if: steps.pr.outputs.number
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.pr.outputs.number }}
          HAS_CHANGES: ${{ steps.comment.outputs.changes }}
        run: |
          existing="$(gh api --paginate "repos/$REPO/issues/$NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- jarvis-view-screenshots -->"))) | .id' | head -n 1)"
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F "body=@$RUNNER_TEMP/comment.md" > /dev/null
            echo "Updated comment $existing"
          elif [ "$HAS_CHANGES" = "true" ]; then
            gh api -X POST "repos/$REPO/issues/$NUMBER/comments" -F "body=@$RUNNER_TEMP/comment.md" > /dev/null
            echo "Created comment"
          else
            echo "No visual changes and no earlier comment; not commenting."
          fi

  cleanup:
    # No PR code is checked out or run here; the job only deletes a folder by PR number.
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Remove the PR's screenshots
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git init -q assets
          cd assets
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config "http.https://github.com/.extraheader" "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git remote add origin "https://github.com/$REPO.git"
          if ! git ls-remote --exit-code --heads origin "$ASSETS_BRANCH" > /dev/null; then
            echo "No $ASSETS_BRANCH branch yet."
            exit 0
          fi
          git fetch -q --depth 1 origin "$ASSETS_BRANCH"
          git checkout -q -b "$ASSETS_BRANCH" FETCH_HEAD
          if [ ! -d "pr-$NUMBER" ]; then
            echo "No screenshots for PR #$NUMBER."
            exit 0
          fi
          git rm -rq "pr-$NUMBER"
          git commit -q -m "Remove screenshots for closed PR #$NUMBER"
          for _ in 1 2 3; do
            git push -q origin "HEAD:$ASSETS_BRANCH" && exit 0
            git pull -q --rebase origin "$ASSETS_BRANCH"
          done
          echo "::error::Could not push to $ASSETS_BRANCH"
          exit 1
