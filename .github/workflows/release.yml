name: Release Windows installer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Verify tag matches package version
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package.json version v$version"
          }

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test

      - name: Build Windows installer
        run: npm run dist:win

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            Get-ChildItem 'release/Jarvis-Setup-*.exe' | Select-Object -ExpandProperty FullName
            Get-ChildItem 'release/Jarvis-Setup-*.exe.blockmap' | Select-Object -ExpandProperty FullName
            Get-Item 'release/latest.yml' | Select-Object -ExpandProperty FullName
          )

          gh release view $env:GITHUB_REF_NAME | Out-Null
          $releaseExists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0

          if ($releaseExists) {
            gh release upload $env:GITHUB_REF_NAME $assets --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $assets --verify-tag --generate-notes --title "Jarvis $env:GITHUB_REF_NAME"
          }

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-installer
          path: |
            release/Jarvis-Setup-*.exe
            release/Jarvis-Setup-*.exe.blockmap
            release/latest.yml
          retention-days: 14
