appId: io.github.rajbos.jarvis
productName: Jarvis
artifactName: Jarvis-Setup-${version}.${ext}
directories:
  output: release
publish:
  provider: github
  owner: rajbos
  repo: Jarvis
  releaseType: release
files:
  - dist/**/*
  - assets/**/*
  - package.json
# The MCP server is spawned by other MCP clients as a plain Node script, so it
# (and the modules it needs) must live outside app.asar. That includes the MCP
# SDK's own runtime dependencies; tests/unit/mcp-asar-unpack.test.ts fails when
# one is missing here.
# The session-usage worker (dist/services/local-session-usage-worker.js, a
# worker_threads entry) loads @rajbos/ai-engineering-fluency/session, which reads
# its sql-wasm.wasm from disk; it is unpacked too so the worker never depends on
# asar-transparent fs inside a worker thread. The same test covers it.
asarUnpack:
  - dist/mcp-server/**
  - dist/services/local-file-index.js
  - dist/services/logger.js
  - dist/services/local-session-usage-worker.js
  - node_modules/@rajbos/ai-engineering-fluency/**
  - node_modules/@modelcontextprotocol/**
  - node_modules/zod/**
  - node_modules/zod-to-json-schema/**
  - node_modules/ajv/**
  - node_modules/ajv-formats/**
  - node_modules/fast-deep-equal/**
  - node_modules/fast-uri/**
  - node_modules/json-schema-traverse/**
  - node_modules/sql.js/**
extraResources:
  - from: scripts/read-onenote-section.ps1
    to: scripts/read-onenote-section.ps1
win:
  target:
    - nsis
  icon: assets/Jarvis1024.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Jarvis
  include: installer/installer.nsh
