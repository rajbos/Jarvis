appId: io.github.rajbos.jarvis
productName: Jarvis
artifactName: Jarvis-Setup-${version}.${ext}
directories:
  output: release
publish:
  provider: github
  owner: rajbos
  repo: Jarvis
  releaseType: release
files:
  - dist/**/*
  - assets/**/*
  - package.json
# The MCP server is spawned by other MCP clients as a plain Node script, so it
# (and the modules it needs) must live outside app.asar.
asarUnpack:
  - dist/mcp-server/**
  - dist/services/local-file-index.js
  - node_modules/@modelcontextprotocol/**
  - node_modules/zod/**
  - node_modules/sql.js/**
extraResources:
  - from: scripts/read-onenote-section.ps1
    to: scripts/read-onenote-section.ps1
win:
  target:
    - nsis
  icon: assets/Jarvis1024.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Jarvis
